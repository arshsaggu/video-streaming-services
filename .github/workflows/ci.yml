# CI/CD: test -> build -> scan -> tag -> publish (GHCR), plus a full-stack e2e run.
#
#   pull_request : tests, single-arch build, Trivy scan, compose e2e   (nothing pushed)
#   push to main : all of the above + multi-arch (amd64/arm64) images pushed to GHCR
#   tag v*.*.*   : same, plus semver tags (1.2.3, 1.2, latest)
name: ci

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------ unit tests
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/auth-service/requirements.txt
      - name: auth-service tests (Python)
        working-directory: services/auth-service
        run: |
          pip install -r requirements.txt
          python -m unittest discover -s tests -t . -v

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: file-service tests (Node, run as a non-root user so permission tests are not skipped)
        working-directory: services/file-service
        run: node --test
      - name: upload-web tests (Node)
        working-directory: services/upload-web
        run: node --test
      - name: streaming-web tests (Node)
        working-directory: services/streaming-web
        run: node --test

  # ------------------------------------------------------------------ build, scan, tag, publish
  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # push to ghcr.io
      security-events: write   # upload Trivy SARIF to the Security tab
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth-service
            context: services/auth-service
            dockerfile: services/auth-service/Dockerfile
          - service: file-service
            context: services/file-service
            dockerfile: services/file-service/Dockerfile
          - service: upload-web
            context: services
            dockerfile: services/upload-web/Dockerfile
          - service: streaming-web
            context: services
            dockerfile: services/streaming-web/Dockerfile
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/vss-${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      # Run the Dockerfile's own test stage, so the image is tested exactly as built.
      - name: Test stage
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: test
          cache-from: type=gha,scope=${{ matrix.service }}

      - name: Build (amd64, local) for scanning
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: runtime
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}:scan
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Trivy scan (report)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}:scan
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true

      - name: Upload scan to GitHub Security tab
        if: always() && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}

      - name: Trivy gate (fail on fixable CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}:scan
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Image size
        run: docker image ls ${{ env.IMAGE }}:scan --format '{{.Repository}}:{{.Tag}} {{.Size}}' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # short-lived token issued per run; nothing stored in the repo

      - name: Build multi-arch and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # ------------------------------------------------------------------ full stack
  e2e:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate throwaway secrets
        run: ./scripts/init-secrets.sh
      - name: Start stack
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: End-to-end tests
        run: ./scripts/e2e.sh
      - name: Persistence test
        run: ./scripts/persistence-test.sh
      - name: Failure / recovery test
        run: ./scripts/failure-test.sh
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidence
          path: results/
      - name: Tear down
        if: always()
        run: docker compose down -v
